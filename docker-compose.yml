services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_SPEC: "."
    x-preview-port: 8000
    env_file:
      - ./backend/dev.env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      CORS_ORIGINS: http://localhost,http://localhost:80
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_HOST: backend
    x-preview-port: 80
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  app-data:
