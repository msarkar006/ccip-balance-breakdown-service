---
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: ccip
          POSTGRES_USER: ccip
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccip -d ccip"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      SEED_ENABLED: "true"
      JWT_SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
      CORS_ORIGINS: http://localhost:5173
      PG_URL: postgresql+psycopg://ccip:ci-only-password@localhost:5432/ccip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install ".[dev,postgres]"
      - name: Ruff
        run: ruff check app tests
      - name: Mypy
        run: mypy app
      - name: Migrations on PostgreSQL
        run: DATABASE_URL="$PG_URL" alembic upgrade head
      - name: Seed on PostgreSQL
        run: DATABASE_URL="$PG_URL" python -m app.seed
      - name: Pytest
        run: pytest -q --cov=app --junitxml=pytest-report.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npx tsc --noEmit
      - run: npx vitest --run
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml config -q
      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.postgres.yml build
